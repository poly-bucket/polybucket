services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    ports:
      - "11666:11666"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:11666
      - Database__Host=db
      - Database__Port=5432
      - Database__Name=polybucket
      - Database__Username=postgres
      - Database__Password=postgres
      - JWT_SECRET=development-jwt-secret-key-change-in-production-minimum-32-characters-long
      - AppSettings__Security__JwtSecret=development-jwt-secret-key-change-in-production-minimum-32-characters-long
      - Admin__Username=admin
      - Admin__Email=admin@polybucket.com
      - Admin__Password=Polybucket123
      - AppSettings__Frontend__BaseUrl=http://localhost:12001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317
      - OTEL_SERVICE_NAME=polybucket-api
      - OTEL_RESOURCE_ATTRIBUTES=service.name=polybucket-api,service.version=1.0.0,deployment.environment=Development
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./PolyBucket.sln:/app/PolyBucket.sln
      - /app/backend/bin
      - /app/backend/obj
    networks:
      - polybucket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11666/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: Dockerfile.frontend-next
      target: development
    ports:
      - "12001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:11666
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    networks:
      - polybucket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:latest
    container_name: polybucket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: polybucket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - polybucket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polybucket"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: polybucket-seaweedfs
    ports:
      - "8333:8333"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: polybucket
      AWS_SECRET_ACCESS_KEY: polybucketsecret
    volumes:
      - seaweedfs-data:/data
    command: server -dir=/data -s3 -s3.port=8333 -ip=0.0.0.0
    restart: unless-stopped
    networks:
      - polybucket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    container_name: polybucket-mailpit
    profiles: ["mail"]
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
    networks:
      - polybucket-network

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: polybucket-lgtm
    ports:
      - "3100:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - ENABLE_LOGS_GRAFANA=true
      - ENABLE_LOGS_LOKI=true
      - ENABLE_LOGS_PROMETHEUS=true
      - ENABLE_LOGS_TEMPO=true
      - ENABLE_LOGS_OTELCOL=true
    volumes:
      - lgtm-data:/data
    restart: unless-stopped
    networks:
      - polybucket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  polybucket-network:
    name: polybucket-network
    driver: bridge

volumes:
  postgres-data:
  seaweedfs-data:
  lgtm-data:
